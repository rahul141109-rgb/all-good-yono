<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AllGoodYono Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #101522;
      color: #fff; font-family: Arial, sans-serif;
    }
    .wrap { max-width: 520px; margin: 25px auto; }
    .card {
      background: #1b2435; padding: 22px; border-radius: 16px;
      border: 1px solid #344056; margin-bottom: 18px;
    }
    h1 { font-size: 25px; text-align: center; }
    p { color: #b9c4d8; line-height: 1.5; }
    input, select, button {
      width: 100%; padding: 13px; margin: 7px 0;
      border-radius: 9px; border: 1px solid #46536b;
      font-size: 15px;
    }
    input, select { background: #111827; color: white; }
    input[type="file"] { font-size: 13px; }
    button {
      background: #48d597; color: #102019; border: 0;
      font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .secondary { background: #344056; color: white; }
    .hidden { display: none; }
    #status { overflow-wrap: anywhere; }
    .hint { font-size: 13px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>AllGoodYono Admin</h1>
  <p style="text-align:center">Login karke apni website par apps add karo.</p>

  <section class="card" id="loginBox">
    <h3>Admin Login</h3>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </section>

  <section class="card hidden" id="adminBox">
    <h3>Add New App</h3>
    <form id="appForm">
      <input id="appName" placeholder="App name" required>
      <select id="category" required>
        <option value="">Select category</option>
        <option>Education</option>
        <option>Tools</option>
        <option>Entertainment</option>
        <option>Productivity</option>
        <option>Games</option>
        <option>Other</option>
      </select>
      <input id="version" placeholder="App version (e.g. 1.0)" required>
      <input id="link" type="url" placeholder="Official download URL (https://...)" required>
      <label for="logo">App logo (PNG, JPG or WEBP; max 2 MB)</label>
      <input id="logo" type="file" accept="image/png,image/jpeg,image/webp" required>
      <button id="addButton" type="submit">Upload Logo & Add App</button>
    </form>
    <button class="secondary" id="logoutButton" type="button">Logout</button>
  </section>

  <section class="card">
    <h3>Status</h3>
    <p id="status" role="status">Admin panel ready. Please log in.</p>
    <p class="hint">Logo files are public for display on the website. Only your authorised admin account should be able to upload them.</p>
  </section>
</div>

<script>
  const SUPABASE_URL = "https://pwhqgafnqboabruhnarf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_c66NZz656lAB28ITz7WjBA_qtqatqmv";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = (id) => document.getElementById(id);
  const status = (message) => { $("status").textContent = message; };

  function showAdmin(isLoggedIn) {
    $("loginBox").classList.toggle("hidden", isLoggedIn);
    $("adminBox").classList.toggle("hidden", !isLoggedIn);
  }

  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    status("Logging in...");

    const { data, error } = await client.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });

    if (error) {
      status("Login failed: " + error.message);
      return;
    }

    showAdmin(true);
    status("Login successful. Ab app add kar sakte ho.");
  });

  $("logoutButton").addEventListener("click", async () => {
    const { error } = await client.auth.signOut();
    if (error) {
      status("Logout error: " + error.message);
      return;
    }
    showAdmin(false);
    status("You have logged out.");
  });

  $("appForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const { data: sessionData } = await client.auth.getSession();
    if (!sessionData.session) {
      showAdmin(false);
      status("Session nahi mila. Dobara login karo.");
      return;
    }

    const name = $("appName").value.trim();
    const category = $("category").value;
    const version = $("version").value.trim();
    const link = $("link").value.trim();
    const file = $("logo").files[0];

    if (!file) {
      status("Pehle app ka logo select karo.");
      return;
    }

    const allowedTypes = ["image/png", "image/jpeg", "image/webp"];
    if (!allowedTypes.includes(file.type)) {
      status("Sirf PNG, JPG ya WEBP image select karo.");
      return;
    }

    if (file.size > 2 * 1024 * 1024) {
      status("Logo 2 MB se chhota hona chahiye.");
      return;
    }

    if (!link.startsWith("https://")) {
      status("Download link https:// se shuru hona chahiye.");
      return;
    }

    const button = $("addButton");
    button.disabled = true;
    status("Logo upload ho raha hai...");

    try {
      const extension = ({
        "image/png": "png",
        "image/jpeg": "jpg",
        "image/webp": "webp"
      })[file.type];

      const filePath = crypto.randomUUID() + "." + extension;

      const { error: uploadError } = await client.storage
        .from("app-logos")
        .upload(filePath, file, {
          contentType: file.type,
          upsert: false
        });

      if (uploadError) throw uploadError;

      const { data: publicData } = client.storage
        .from("app-logos")
        .getPublicUrl(filePath);

      status("Logo uploaded. App save ho rahi hai...");

      const { error: insertError } = await client
        .from("Apps")
        .insert([{
          name: name,
          category: category,
          version: version,
          logo: publicData.publicUrl,
          link: link
        }]);

      if (insertError) throw insertError;

      $("appForm").reset();
      status("Success! App database mein add ho gayi. Website listing ko alag se connect karna hoga agar woh abhi Supabase se data nahi leti.");
    } catch (error) {
      status("Error: " + error.message);
    } finally {
      button.disabled = false;
    }
  });

  client.auth.getSession().then(({ data, error }) => {
    if (error) {
      status("Session check failed: " + error.message);
      return;
    }
    showAdmin(!!data.session);
    if (data.session) status("You are logged in. App add kar sakte ho.");
  });
</script>
</body>
    </html>
